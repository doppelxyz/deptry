name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      artifact_type:
        description: Artifact type to build
        required: true
        default: standalone
        type: choice
        options:
          - standalone
          - wheel
          - both
      release_tag:
        description: Release tag to create/use for standalone artifacts
        required: false
        type: string
      release_title:
        description: Release title to create for standalone artifacts
        required: false
        type: string

env:
  PYTHON_VERSION: '3.14'
  STANDALONE_PYTHON_VERSION: '3.13'
  # renovate: datasource=pypi depName=uv
  UV_VERSION: '0.9.21'

permissions: {}

jobs:
  set-version:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.release-version.outputs.release_version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            release_version="${{ github.ref_name }}"
          else
            release_version="${{ github.event.inputs.release_tag }}"
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Validate standalone release tag
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'standalone' || github.event.inputs.artifact_type == 'both') }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ steps.release-version.outputs.release_version }}" ]; then
            echo "release_tag is required when building standalone artifacts via workflow_dispatch" >&2
            exit 1
          fi

      - name: Update project version
        if: ${{ steps.release-version.outputs.release_version != '' }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.release_version }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pyproject-toml
          path: pyproject.toml

  linux:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'wheel' || github.event.inputs.artifact_type == 'both') }}
    runs-on: ubuntu-24.04
    needs: [set-version]
    strategy:
      matrix:
        target: [x86_64, aarch64]
        manylinux: [auto, musllinux_1_1]
        python: ['3.14', 'pypy3.11']
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pyproject-toml

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter ${{ startsWith(matrix.python, 'pypy') && matrix.python || format('python{0}', matrix.python) }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}-${{ matrix.python }}
          path: dist

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'wheel' || github.event.inputs.artifact_type == 'both') }}
    runs-on: windows-2025
    needs: [set-version]
    strategy:
      matrix:
        target: [x64]
        python: ['3.14', 'pypy3.11']
        # PyPy doesn't support Windows ARM64.
        include:
          - python: '3.14'
            target: aarch64
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pyproject-toml

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Install safe-chain
        shell: pwsh
        run: |
          iex "& { $(iwr 'https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.ps1' -UseBasicParsing) } -ci"
          "$HOME/.safe-chain/shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          # Recent versions (last one tested 1.7.8) lead to failures on Windows aarch64, so forcing the version for now.
          maturin-version: '1.7.4'
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.setup-python.outputs.python-path }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'wheel' || github.event.inputs.artifact_type == 'both') }}
    runs-on: macos-15
    needs: [set-version]
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python: ['3.14', 'pypy3.11']
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pyproject-toml

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
    
      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.setup-python.outputs.python-path }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  sdist:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'wheel' || github.event.inputs.artifact_type == 'both') }}
    runs-on: ubuntu-24.04
    needs: [set-version]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pyproject-toml

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'wheel' || github.event.inputs.artifact_type == 'both') }}
    runs-on: ubuntu-24.04
    needs:
      - linux
      - windows
      - macos
      - sdist
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: '[dry-run] Publish to PyPI'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: upload
          args: --help

  prepare-standalone-release:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'standalone' || github.event.inputs.artifact_type == 'both')) }}
    needs: [set-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.set-version.outputs.release_version }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag available." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          title="${RELEASE_TITLE:-$RELEASE_TAG}"
          gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "$title" --notes ""

  standalone-binaries:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'standalone' || github.event.inputs.artifact_type == 'both')) }}
    needs: [set-version]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            is_linux: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            is_linux: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            is_linux: true
    name: standalone (${{ matrix.target }})
    env:
      RELEASE_VERSION: ${{ needs.set-version.outputs.release_version }}
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pyproject-toml

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: setup-python
        with:
          python-version: ${{ env.STANDALONE_PYTHON_VERSION }}

      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: Build wheel
        if: ${{ !matrix.is_linux }}
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.setup-python.outputs.python-path }}
          sccache: 'true'

      - name: Build manylinux wheel
        if: ${{ matrix.is_linux }}
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter python${{ env.STANDALONE_PYTHON_VERSION }}
          sccache: 'true'

      - name: Install pex
        run: python -m pip install certifi pex

      - name: Build standalone executable
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(echo dist/deptry-*.whl)"
          export SSL_CERT_FILE="$(python -c 'import certifi; print(certifi.where())')"

          pex "$wheel" \
            --python "${{ steps.setup-python.outputs.python-path }}" \
            --venv \
            --scie eager \
            --scie-pbs-stripped \
            -c deptry \
            -o dist/deptry

      - name: Package standalone executable
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION:-${GITHUB_REF_NAME:-dev}}"
          archive_root="deptry-${version}-${{ matrix.target }}"

          mkdir -p "dist/${archive_root}"
          cp dist/deptry "dist/${archive_root}/deptry"
          cp LICENSE "dist/${archive_root}/LICENSE"

          tar -C dist -czf "dist/${archive_root}.tar.gz" "${archive_root}"
          shasum -a 256 "dist/${archive_root}.tar.gz" > "dist/${archive_root}.tar.gz.sha256"

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: standalone-${{ matrix.target }}
          path: |
            dist/deptry-${{ env.RELEASE_VERSION || github.ref_name || 'dev' }}-${{ matrix.target }}.tar.gz
            dist/deptry-${{ env.RELEASE_VERSION || github.ref_name || 'dev' }}-${{ matrix.target }}.tar.gz.sha256

  publish-standalone:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.artifact_type == 'standalone' || github.event.inputs.artifact_type == 'both')) }}
    needs: [set-version, prepare-standalone-release, standalone-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Upload standalone assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.set-version.outputs.release_version }}
        run: gh release upload "$RELEASE_TAG" standalone-*/* --clobber

  publish-docs:
    runs-on: ubuntu-24.04
    needs: [set-version]
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safe-chain
        shell: bash
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"

      - name: Deploy documentation
        if: ${{ github.event_name == 'release' }}
        run: uv run --only-group docs mkdocs gh-deploy --force

      - name: '[dry-run] Deploy documentation'
        if: ${{ github.event_name != 'release' }}
        run: uv run --only-group docs mkdocs gh-deploy --help
